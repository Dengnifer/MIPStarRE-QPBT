status:
  scope: >-
    The comparator registers four headline declarations: completeness of the
    Pauli basis test, soundness of the simultaneous low-degree test, Pauli
    basis test soundness, and its qubit form.
  main_results:
    - name: "Pauli basis test completeness"
      declaration: "MIPStarRE.QPBT.Palomar.exists_spcc_value_one"
      file: "QPBT/Palomar/PauliCompleteness.lean"
      comparator_config: "comparator.json"
    - name: "Simultaneous low-degree test soundness"
      declaration: "MIPStarRE.QPBT.Palomar.exists_ld_soundness"
      file: "QPBT/Palomar/LowDegreeSoundness.lean"
      comparator_config: "comparator.json"
    - name: "Pauli basis test soundness"
      declaration: "MIPStarRE.QPBT.Palomar.pauli_soundness"
      file: "QPBT/Palomar/PauliSoundness.lean"
      comparator_config: "comparator.json"
    - name: "Qubit-coordinate Pauli soundness"
      declaration: "MIPStarRE.QPBT.Palomar.pauli_soundness_qubit"
      file: "QPBT/Palomar/PauliSoundness.lean"
      comparator_config: "comparator.json"
  declarations:
    - "MIPStarRE.QPBT.Palomar.exists_spcc_value_one"
    - "MIPStarRE.QPBT.Palomar.exists_ld_soundness"
    - "MIPStarRE.QPBT.Palomar.pauli_soundness"
    - "MIPStarRE.QPBT.Palomar.pauli_soundness_qubit"

alignment:
  source_statement: "other"
  translation_notes: >-
    The four compact declarations retain the registered parameter and
    quantifier order, witnesses, explicit deltaLd or deltaQld bounds, and the
    complete fixed-field selector contract. A source comparison by an AI
    agent (OpenAI Codex CLI, model gpt-6-astra) found no substantive drift
    between the compact declarations and the library statements; that is
    agent review, not human approval. The compact declarations are transported
    from the library theorems by proved game, strategy, and extraction equivalences.

fidelity:
  divergences: >-
    The zero-direction line/point predicate uses universal quantification over
    all affine parameters representing the point; at zero direction this
    requires the answer polynomial to be constant with the point's value.
    This completes the unspecified choice of parameter in MIP*=RE v3 Figure 3.
    Low-degree soundness follows a directly indexed LIDT reduction and correlated
    seed dilation, with simultaneity obtained by the combining argument of
    NEEXP Theorem 4.43. It does not use or establish the printed tensor-code
    game correspondence or the asserted bound K >= 12 m (d + 1) for K = m^3 d.
    The inherited LIDT theorem uses corrected sampling conditions
    K >= 400 m d and K > 0; the QPBT constructs K = 2560000 m^3 d and proves
    both conditions internally. The once-and-for-all finite-field selector
    records a self-dual normal basis and its natural binary encoding explicitly.
    The four registered results keep their admissibility conditions and explicit
    deltaLd or deltaQld error functions; they concern finite-dimensional strategies
    and do not formalize the whole MIP*=RE theorem. SOURCE_NOTES.md explains
    these qualifications with links to the relevant local declarations.

