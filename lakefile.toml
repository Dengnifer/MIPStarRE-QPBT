name = "MIPStarRE"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["MIPStarRE", "Solution"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc2"

[[lean_lib]]
name = "MIPStarRE"

[[lean_lib]]
name = "Challenge"
globs = ["Challenge"]

[[lean_lib]]
name = "Solution"
