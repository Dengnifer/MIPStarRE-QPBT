name = "QPBT"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["QPBT", "Solution"]

[leanOptions]
autoImplicit = false
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "0df444a360eaa60ab8c11dca51a86af692955474"

[[require]]
name = "MIPStarRE"
git = "https://github.com/LionSR/MIPStarRE"
rev = "f382c801026f53a9efc260fdee707cb35e0adb15"

[[lean_lib]]
name = "QPBT"

[[lean_lib]]
name = "Challenge"
globs = ["Challenge"]

[[lean_lib]]
name = "Solution"
